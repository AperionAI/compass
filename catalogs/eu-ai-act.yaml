framework: eu-ai-act
name: EU AI Act
version: "Regulation (EU) 2024/1689 (incl. Digital Omnibus adjustments)"
source: "Regulation (EU) 2024/1689 laying down harmonised rules on artificial intelligence (Artificial Intelligence Act), Official Journal L, 12 July 2024."
description: >
  Self-assessment for providers and deployers of AI systems, including GPAI.
  Reports distinguish obligations that are binding now (Art. 5, Art. 50,
  GPAI Arts. 51–55) from Annex III high-risk duties deferred to 2 December
  2027. This is a preparation aid, not a legal conformity assessment or a
  substitute for a notified body.

dimensions:
  - id: scope_risk
    title: Scope, prohibited practices & risk management
    description: Article 5 is in force (since Feb 2025). Article 9 high-risk risk management is deferred to 2 Dec 2027.
  - id: transparency_now
    title: Transparency obligations in force
    description: Article 50 — disclosure and synthetic-content marking, binding from 2 August 2026 (not deferred by the Omnibus).
  - id: gpai
    title: General-purpose AI (GPAI) provider obligations
    description: Articles 51–55 — in force since August 2025. Answer N/A if you are not a GPAI provider placing a model on the market.
  - id: data_governance
    title: Data & data governance (high-risk, Dec 2027)
    description: Article 10 — data quality, representativeness, and bias mitigation for high-risk systems.
  - id: documentation_records
    title: Technical documentation & record-keeping (high-risk, Dec 2027)
    description: Articles 11 (Annex IV) and 12 — the paper trail and the automatic logs.
  - id: transparency_oversight
    title: High-risk transparency & human oversight (Dec 2027)
    description: Articles 13 and 14 — instructions for use and keeping a human meaningfully in control.
  - id: robustness_quality
    title: Accuracy, robustness, security & quality management (high-risk, Dec 2027)
    description: Articles 15 and 17 — the system works, resists attack, and is managed under a QMS.
  - id: deployer_incident
    title: Deployer obligations, monitoring & incidents (high-risk, Dec 2027)
    description: Articles 26, 72 and 73 — using the system correctly and reporting serious incidents. Art. 79 is the related market-surveillance procedure.

controls:
  # ── Scope, prohibited practices & risk management ──────────────────────────
  - id: art_5_prohibited
    dimension: scope_risk
    framework_ref: "Art. 5"
    effective_date: "2025-02-02"
    title: No prohibited practices
    question: >
      Have you confirmed the AI system does not perform any Article 5
      prohibited practice (e.g. social scoring, manipulative techniques,
      untargeted facial-image scraping, real-time remote biometric ID)?
    guidance: Article 5 is an outright ban, not a control to mitigate. A single prohibited use makes the system unlawful.
    weight: 3
    remediation: >
      Remove the prohibited functionality or the use case entirely. No amount
      of downstream governance makes an Article 5 practice compliant.

  - id: art_9_risk_system
    dimension: scope_risk
    framework_ref: "Art. 9"
    effective_date: "2027-12-02"
    title: Risk-management system established
    question: >
      Do you operate a documented, continuously maintained risk-management
      system across the AI system's lifecycle (identify, estimate, evaluate,
      mitigate)?
    weight: 2
    remediation: >
      Stand up a lifecycle risk-management process with a written risk register.
      A runtime policy layer (per-route/per-key policy graph with tiered rules)
      turns the register into enforced controls rather than a static document.

  - id: art_9_residual_risk
    dimension: scope_risk
    framework_ref: "Art. 9(5)"
    effective_date: "2027-12-02"
    title: Residual risks judged acceptable and communicated
    question: >
      Are residual risks (after mitigation) evaluated, documented, and judged
      acceptable, with any needed information provided to deployers?
    remediation: >
      Document residual risk per identified hazard and the basis for accepting
      it; surface deployer-facing information in your instructions for use.

  # ── Data & data governance ────────────────────────────────────────────────
  - id: art_10_data_quality
    dimension: data_governance
    framework_ref: "Art. 10(2)-(3)"
    effective_date: "2027-12-02"
    title: Training/validation/test data quality
    question: >
      Are your training, validation, and test datasets relevant, sufficiently
      representative, and (to the best extent possible) free of errors and
      complete for the intended purpose?
    guidance: For hosted/frontier models you do not train, this covers the inference-time data you govern and any fine-tuning or retrieval data you control.
    weight: 2
    remediation: >
      Document dataset provenance and quality criteria for data you control.
      Where the base model is provider-managed, record that boundary and govern
      inference-time and retrieval data with classification at ingest and egress.

  - id: art_10_bias
    dimension: data_governance
    framework_ref: "Art. 10(2)(f)-(g)"
    effective_date: "2027-12-02"
    title: Bias examination and mitigation
    question: >
      Do you examine datasets for possible biases likely to affect health,
      safety, or fundamental rights, and take measures to detect, prevent, and
      mitigate them?
    weight: 2
    remediation: >
      Add bias testing to your evaluation suite for outcomes that affect
      individuals; record findings and mitigations. Route flagged outputs to
      review rather than letting them act unattended.

  - id: art_10_special_categories
    dimension: data_governance
    framework_ref: "Art. 10(5)"
    effective_date: "2027-12-02"
    title: Special-category data safeguards
    question: >
      Where special categories of personal data are processed for bias
      monitoring, are the strict safeguards and access controls in place?
    remediation: >
      Restrict special-category processing to what is strictly necessary, with
      access controls, pseudonymisation, and deletion policies. Classify and
      barrier sensitive fields so agents cannot exfiltrate them.

  # ── Technical documentation & record-keeping ──────────────────────────────
  - id: art_11_annex_iv
    dimension: documentation_records
    framework_ref: "Art. 11 / Annex IV"
    effective_date: "2027-12-02"
    title: Technical documentation maintained (Annex IV)
    question: >
      Do you maintain up-to-date technical documentation demonstrating
      compliance per Annex IV (system description, development, monitoring,
      performance, risk management)?
    weight: 2
    remediation: >
      Maintain a living technical file. An AI inventory (every provider, model,
      and route in use) plus a signed bill-of-materials keeps Annex IV current
      instead of a once-a-year scramble.

  - id: art_12_logging
    dimension: documentation_records
    framework_ref: "Art. 12(1)"
    effective_date: "2027-12-02"
    title: Automatic logging over the lifecycle
    question: >
      Does the system automatically record events (logs) over its lifetime,
      capturing inputs, outputs, model/provider, identity, and decisions?
    guidance: Compass can corroborate this from an exported request-log file.
    weight: 3
    auto_checks: [logging_completeness]
    remediation: >
      Emit a per-request log capturing input, output, model, provider, latency,
      cost, the acting identity, and any policy decision. A gateway that sees
      every call is the natural chokepoint to produce these logs uniformly.

  - id: art_12_traceability
    dimension: documentation_records
    framework_ref: "Art. 12(2)-(3)"
    effective_date: "2027-12-02"
    title: Tamper-evident traceability
    question: >
      Are the logs protected so that a record of operation can be reconstructed
      and their integrity independently verified (tamper-evidence)?
    guidance: Compass can verify an exported hash-chained audit log offline.
    weight: 3
    auto_checks: [audit_chain_integrity]
    remediation: >
      Hash-chain the log (each entry signs over the previous) so insertion,
      deletion, or mutation is detectable, and publish an independent verifier a
      regulator can run without trusting the system that produced the log.

  # ── Transparency & human oversight ────────────────────────────────────────
  - id: art_13_transparency
    dimension: transparency_oversight
    framework_ref: "Art. 13"
    effective_date: "2027-12-02"
    title: Instructions for use (high-risk)
    question: >
      (High-risk) Do you provide deployers with the information needed to
      interpret the system's output and use it correctly — including
      intended purpose, limitations, and human-oversight measures?
    remediation: >
      Maintain instructions for use that a deployer can actually follow.
      High-risk Art. 13 is deferred to 2 Dec 2027; if you interact with
      people today, see the Article 50 disclosure control instead.

  - id: art_14_oversight_design
    dimension: transparency_oversight
    framework_ref: "Art. 14(1)-(4)"
    effective_date: "2027-12-02"
    title: Human oversight designed in
    question: >
      Is the system designed so a natural person can effectively oversee it —
      understand its limits, monitor operation, interpret output, and decide not
      to use it or to intervene?
    weight: 2
    remediation: >
      Build oversight into the workflow: hold high-stakes actions for a human,
      make the decision context legible, and give the overseer a real stop.

  - id: art_14_intervention
    dimension: transparency_oversight
    framework_ref: "Art. 14(4)(d)-(e)"
    effective_date: "2027-12-02"
    title: Ability to intervene or stop
    question: >
      Can an authorised human intervene in, override, or halt the system's
      operation (including a "stop" that is honoured mid-execution)?
    weight: 2
    auto_checks: [action_risk_coverage]
    remediation: >
      Provide a kill switch / emergency stop that takes the system offline or
      read-only, and hold irreversible (T3) actions for approval so intervention
      is possible before, not after, the action.

  - id: art_14_oversight_effectiveness
    dimension: transparency_oversight
    framework_ref: "Art. 14 (effectiveness)"
    effective_date: "2027-12-02"
    title: Oversight is meaningful, not ceremonial
    question: >
      Do you measure whether human oversight is effective (e.g. override rate,
      review latency) rather than assuming approvals are considered?
    guidance: Compass can compute override rate, approval latency, and outlier reviewers from exported approval tickets.
    auto_checks: [human_oversight]
    remediation: >
      Track override rate (rubber-stamping), approval latency (automation bias),
      and outlier reviewers; alert when oversight looks ceremonial and re-train
      or re-staff the review function.

  # ── Accuracy, robustness, security & quality management ────────────────────
  - id: art_15_accuracy
    dimension: robustness_quality
    framework_ref: "Art. 15(1)-(3)"
    effective_date: "2027-12-02"
    title: Accuracy and appropriate metrics
    question: >
      Does the system achieve an appropriate level of accuracy for its purpose,
      with metrics declared and monitored across the lifecycle?
    remediation: >
      Score response quality and hallucination confidence per request; run
      A/B/regression comparison across providers and alert on degradation.

  - id: art_15_robustness_security
    dimension: robustness_quality
    framework_ref: "Art. 15(4)-(5)"
    effective_date: "2027-12-02"
    title: Robustness and cybersecurity
    question: >
      Is the system resilient to errors, faults, and adversarial manipulation
      (data/model poisoning, prompt injection, evasion), with security controls
      in place?
    weight: 2
    remediation: >
      Add adversarial/robustness testing and block destructive prompts and tool
      calls deterministically. Treat prompt injection as a security boundary,
      not a UX bug.

  - id: art_17_qms
    dimension: robustness_quality
    framework_ref: "Art. 17"
    effective_date: "2027-12-02"
    title: Quality management system
    question: >
      Do you operate a quality-management system ensuring compliance is
      maintained throughout the lifecycle (responsibilities, procedures,
      testing, corrective action)?
    remediation: >
      Run a repeatable QMS: scheduled rescans (PII, multi-turn attacks,
      anomalies), framework evidence reports, and a findings pipeline that
      closes the loop rather than just logging.

  # ── Deployer obligations, monitoring & incidents ──────────────────────────
  - id: art_26_deployer_use
    dimension: deployer_incident
    framework_ref: "Art. 26(1)-(3)"
    effective_date: "2027-12-02"
    title: Deployer uses system per instructions with oversight
    question: >
      (Deployers) Do you use the system per the provider's instructions, assign
      competent human oversight, and monitor operation?
    remediation: >
      Assign named, competent overseers; stamp every request with the acting
      user, groups, and department; follow the provider's instructions for use.

  - id: art_26_deployer_logs
    dimension: deployer_incident
    framework_ref: "Art. 26(6)"
    effective_date: "2027-12-02"
    title: Deployer keeps logs
    question: >
      (Deployers) Do you retain the automatically generated logs under your
      control for the required period?
    auto_checks: [logging_completeness]
    remediation: >
      Retain logs for the period the Act requires (generally >= 6 months unless
      other law applies) with tamper-evidence and defined retention.

  - id: art_72_post_market
    dimension: deployer_incident
    framework_ref: "Art. 72"
    effective_date: "2027-12-02"
    title: Post-market monitoring
    question: >
      Do you have a post-market monitoring system that actively collects and
      reviews performance and incident data after deployment?
    remediation: >
      Continuously monitor live traffic and egress for anomalies; feed findings
      back into the risk-management system and technical documentation.

  - id: art_79_incident_reporting
    dimension: deployer_incident
    framework_ref: "Art. 73"
    effective_date: "2027-12-02"
    title: Serious-incident reporting
    question: >
      Can you detect and report serious incidents and malfunctions to the
      relevant authority within the Act's timelines (Article 73)?
    guidance: >
      Control id is unchanged so existing assessment files keep their
      answers. Article 73 is the reporting duty; Article 79 is the related
      market-surveillance procedure.
    weight: 2
    auto_checks: [audit_chain_integrity]
    remediation: >
      Wire severity-tagged events to an incident pipeline with the evidence
      range attached, so an Article 73 report can be filed within the
      deadline instead of reconstructed by hand. Art. 79 is the procedure
      a market-surveillance authority uses once a report is in.

  # ── Article 50 — transparency in force from 2 Aug 2026 ────────────────
  - id: art_50_disclosure
    dimension: transparency_now
    framework_ref: "Art. 50(1)"
    effective_date: "2026-08-02"
    title: Users know they are interacting with AI
    question: >
      Where people interact with the AI system, are they clearly informed
      that they are interacting with AI — unless it is obvious from the
      context?
    guidance: >
      Binding from 2 August 2026. This is not the high-risk Art. 13
      instructions-for-use duty (deferred to Dec 2027).
    weight: 3
    remediation: >
      Disclose AI involvement at the point of interaction (banner, header,
      or equivalent). If the interaction is obvious from context, document
      why. Do not rely on a buried terms-of-use sentence.

  - id: art_50_synthetic_marking
    dimension: transparency_now
    framework_ref: "Art. 50(2)"
    effective_date: "2026-08-02"
    title: Synthetic content is machine-readable
    question: >
      Is AI-generated or substantially modified content marked in a
      machine-readable format so it can be detected as synthetic?
    guidance: >
      Art. 50(2). Systems placed on the market before 2 Aug 2026 have until
      2 Dec 2026; new systems must comply from 2 Aug 2026.
    weight: 2
    remediation: >
      Embed a machine-readable mark (watermark, C2PA-style credential, or
      equivalent) on generated or substantially modified content. A human-only
      disclaimer does not satisfy the machine-readable limb.

  - id: art_50_deepfake
    dimension: transparency_now
    framework_ref: "Art. 50(4)"
    effective_date: "2026-08-02"
    title: Deepfake / emotion-recognition labelling
    question: >
      Where the system generates deepfakes, or detects emotion / biometric
      categories, is that output labelled as such for the people who see it?
    guidance: Answer N/A if you do not generate deepfakes and do not perform emotion recognition or biometric categorisation.
    weight: 2
    remediation: >
      Label deepfake, emotion-recognition, and biometric-categorisation
      outputs at the point of display. If those capabilities are out of
      scope, mark the control N/A and record why.

  # ── GPAI Arts. 51–55 — in force since August 2025 ──────────────────────────
  - id: art_51_gpai_scope
    dimension: gpai
    framework_ref: "Art. 51"
    effective_date: "2025-08-02"
    title: GPAI provider / placing on the market
    question: >
      Are you a provider of a general-purpose AI model, or do you place a
      GPAI model on the Union market (including via a product or service)?
    guidance: >
      If no, answer N/A and skip the rest of this dimension. GPAI duties
      have applied since August 2025 and were not deferred by the Omnibus.
    weight: 2
    remediation: >
      Decide the role: GPAI provider, deployer of someone else's GPAI, or
      neither. If you are a provider, the Art. 53 controls below apply. If
      you only call a hosted model, document that boundary.

  - id: art_53_documentation
    dimension: gpai
    framework_ref: "Art. 53(1)(a)-(b)"
    effective_date: "2025-08-02"
    title: GPAI technical documentation
    question: >
      (GPAI providers) Do you keep up-to-date technical documentation of the
      model, including training and testing processes, and make it
      available to the AI Office and national competent authorities on request?
    guidance: Answer N/A if you are not a GPAI provider.
    weight: 2
    remediation: >
      Maintain a living technical file for the GPAI model (architecture,
      training data categories, compute, evaluation). Have a way to produce
      it for the AI Office without a fire drill.

  - id: art_53_copyright
    dimension: gpai
    framework_ref: "Art. 53(1)(c)"
    effective_date: "2025-08-02"
    title: GPAI copyright policy
    question: >
      (GPAI providers) Do you have a policy to comply with Union copyright
      law, including identifying and honouring rights reservations under
      Article 4(3) of Directive (EU) 2019/790?
    guidance: Answer N/A if you are not a GPAI provider.
    weight: 2
    remediation: >
      Publish a copyright policy that covers training-data sources and
      how you honour machine-readable opt-outs. Train the people who
      ingest data, not just the model.

  - id: art_53_training_summary
    dimension: gpai
    framework_ref: "Art. 53(1)(d)"
    effective_date: "2025-08-02"
    title: GPAI training-content summary
    question: >
      (GPAI providers) Have you published a sufficiently detailed summary
      of the content used to train the model, in the AI Office template?
    guidance: Answer N/A if you are not a GPAI provider.
    weight: 2
    remediation: >
      Produce the public training-content summary in the Commission /
      AI Office template and keep it current when the model is retrained.

  - id: art_55_systemic
    dimension: gpai
    framework_ref: "Art. 55"
    effective_date: "2025-08-02"
    title: Systemic-risk GPAI extra obligations
    question: >
      If the model is classified as GPAI with systemic risk (Art. 51),
      do you meet the extra Art. 55 duties (model evaluation, adversarial
      testing, incident tracking, cybersecurity)?
    guidance: Answer N/A if you are not a GPAI provider, or if the model is not classified as systemic-risk.
    weight: 2
    remediation: >
      If you are at or above the systemic-risk threshold, run model
      evaluations (including adversarial tests), track and report serious
      incidents, and keep cybersecurity measures proportionate to the
      risk. If you are not, mark N/A.
